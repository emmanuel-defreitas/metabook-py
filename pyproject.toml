[project]
name = "metabook-py"
version = "3.0.0"
description = "metabook-py"
readme = "README.md"
authors = [{ name = "Emmanuel De Freitas", email = "manny.defreitas7@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.26.0",
]

[tool.vercel]
entrypoint = "src.metabook_py.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabook_py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "integration: exercises real external services (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
