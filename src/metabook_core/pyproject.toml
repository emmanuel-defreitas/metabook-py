[project]
name = "metabook-core"
version = "0.1.0"
description = "Native parsing core for metabook-py (PyO3)"
requires-python = ">=3.13"
license = "MIT"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
module-name = "metabook_core"
bindings = "pyo3"

[tool.uv]
# Rebuild the extension when Rust sources change (uv only watches
# pyproject.toml for path dependencies by default).
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
