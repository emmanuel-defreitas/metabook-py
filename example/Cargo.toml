[package]
name = "metabook-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "GPUI desktop example client for the Book Structure API"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui-motion = "0.1"
gpui-navigator = "0.1"
serde_json = "1"
ureq = "2"

# gpui-motion / gpui-navigator depend on the crates.io `gpui`; point them at
# the same zed git checkout the rest of the stack uses so types unify.
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed" }

[profile.dev]
debug = "limited"
